# Media Acquisition Manager, pulled from Docker Hub (MAM-3). Start it with:
#
#   docker compose up -d
#
# and open http://localhost:8118. To build from this checkout instead, use docker-compose.build.yml.
# Every variable below is optional; put overrides in a .env file next to this one. .env.example
# lists them all with their trade-offs.
services:
  app:
    # APP_TAG: latest (the newest release), a release such as 0.1.0, or a minor version such as 0.1.
    image: vahac/media-acquisition-manager:${APP_TAG:-latest}
    container_name: media-acquisition-manager
    restart: unless-stopped
    # Loopback only by default: the app speaks plain HTTP, and until the owner account exists its
    # setup page makes whoever opens it first the owner. APP_BIND_ADDRESS=0.0.0.0 opens it; create
    # the owner first (.env.example has the trade-off).
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8118}:8118"
    # .env is optional (required: false needs Docker Compose 2.24+). Without one the app generates
    # its secrets on the first start and runs on its defaults, so `docker compose up -d` needs no
    # configuration at all.
    env_file:
      - path: .env
        required: false
    environment:
      # Pinned here as well as in the image, because environment beats env_file: a
      # MAM_Storage__DataDirectory left in .env from a local run can't point the database away from
      # the volume below — the app would fail to start, or keep its data where the next recreate of
      # the container deletes it.
      MAM_Storage__DataDirectory: /data
      # The user and group the app runs as (MAM-39). Unset, the image's own 10001, which can write
      # nowhere in the media. To let replacement (0.3.0) move old copies, set them to the owner of
      # the media folders — usually the same PUID and PGID as your download client, qBittorrent or
      # Transmission; 1000 and 100 on the reference installation — and drop :ro from the media mount
      # below. The app hands its data volume over to them itself when it starts; remove them to go
      # back, and it hands the volume back. In .env they work too. A compose file from 0.3.0
      # (2026-10-11) still has a user: line above this block: it keeps working as before, and PUID
      # and PGID are ignored until that line goes (the log says so). .env.example has the trade-off,
      # docs/adr/0036 says why.
      # PUID: "1000"
      # PGID: "100"
    volumes:
      # The whole state of the installation: mam.db and the generated secrets in .secrets/. Back
      # them up together.
      - mam-data:/data
      # Media folders, read-only by default: with :ro nothing the app does can write to them. To
      # turn replacement on (0.3.0) drop :ro — its moves rename an old copy into .mam-quarantine at
      # the top of each allowed folder, and back out, and delete from there what the owner deletes
      # for good —, set PUID and PGID to the media's owner (environment, above), then switch it on
      # and tick its folders under Media folders. Mount each allowed folder as one mount that
      # holds its libraries, with nothing mounted inside it: a move into the quarantine across two
      # mounts would be a copy, and the app refuses it. Quarantined files stay here, outside the
      # backup of mam-data. docs/adr/0033 says why.
      # Mount them at the path Jellyfin sees them at. A download client that sees them elsewhere
      # (qBittorrent or Transmission at /downloads, say) gets a path mapping under Integrations →
      # the client → Path mappings, not a second mount; docs/adr/0003 says why. The app reads files
      # only inside the folders the owner then allows in the app (user menu → Media folders: /media
      # for the example below), and none until then; docs/adr/0009 says why. Example — adjust the
      # host side and uncomment:
      # - /mnt/media:/media:ro

volumes:
  mam-data:
