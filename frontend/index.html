<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Acquisition Manager</title>
    <!-- Applies the theme before first paint, so a dark-mode visitor never sees a white flash.
         Its SHA-256 is pinned in the CSP (SecurityHeadersMiddleware.ThemeScriptHash): change one
         byte of the script and SecurityHeadersHttpTests fails until the hash is updated. -->
    <script>(function(){try{var t=localStorage.getItem('mam:theme');if(t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark')}}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
