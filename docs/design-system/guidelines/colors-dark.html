<!-- @dsCard group="Colors" viewport="700x150" name="Dark mode" subtitle=".dark on <html> — same names, near-black surfaces, lighter indigo" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px;display:grid;gap:4px;font-size:11px}.s b{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s code{font-size:11px;color:var(--muted-foreground)}.dark .s code{color:var(--muted-foreground)}</style></head><body><div class="dark" style="background:var(--background);padding:14px;border-radius:8px;color:var(--foreground)"><div class="sw"><div class="s"><b style="background:var(--background)"></b><span>Page #0a0a0a</span><code>--background</code></div><div class="s"><b style="background:var(--card)"></b><span>Card #131313</span><code>--card</code></div><div class="s"><b style="background:var(--primary)"></b><span>Primary #6366f1</span><code>--primary</code></div><div class="s"><b style="background:var(--muted-foreground)"></b><span>Muted #a3a3a3</span><code>--muted-foreground</code></div><div class="s"><b style="background:var(--status-up)"></b><span>Up #22c55e</span><code>--status-up</code></div></div></div></body></html>
