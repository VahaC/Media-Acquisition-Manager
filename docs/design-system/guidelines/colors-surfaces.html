<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px;display:grid;gap:4px;font-size:11px}.s b{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s code{font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="sw"><div class="s"><b style="background:var(--background)"></b><span>Page #f1f1f1</span><code>--background</code></div><div class="s"><b style="background:var(--surface)"></b><span>Surface #fafafa</span><code>--surface</code></div><div class="s"><b style="background:var(--card)"></b><span>Card #ffffff</span><code>--card</code></div><div class="s"><b style="background:var(--secondary)"></b><span>Secondary #f5f5f5</span><code>--secondary</code></div><div class="s"><b style="background:var(--accent)"></b><span>Hover #d3d3d3</span><code>--accent</code></div></div></body></html>
