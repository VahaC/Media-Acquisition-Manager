<!-- @dsCard group="Colors" viewport="700x130" name="Text & lines" subtitle="Foreground, muted, subtle; borders and inputs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px;display:grid;gap:4px;font-size:11px}.s b{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s code{font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="sw"><div class="s"><b style="background:var(--foreground)"></b><span>Text #0a0a0a</span><code>--foreground</code></div><div class="s"><b style="background:var(--muted-foreground)"></b><span>Muted #525252</span><code>--muted-foreground</code></div><div class="s"><b style="background:var(--subtle-foreground)"></b><span>Subtle #737373</span><code>--subtle-foreground</code></div><div class="s"><b style="background:var(--border)"></b><span>Border #e5e5e5</span><code>--border</code></div><div class="s"><b style="background:var(--input)"></b><span>Input #d4d4d4</span><code>--input</code></div></div></body></html>
