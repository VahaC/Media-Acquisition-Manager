<!-- @dsCard group="Spacing" viewport="700x120" name="Scale" subtitle="rem steps used across the sheets" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px;display:grid;gap:4px;font-size:11px}.s b{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s code{font-size:11px;color:var(--muted-foreground)}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end"><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:0.125rem;height:0.125rem;background:var(--primary);display:block"></b><span>0.125rem</span><code style="color:var(--muted-foreground)">--space-0.5</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:0.25rem;height:0.25rem;background:var(--primary);display:block"></b><span>0.25rem</span><code style="color:var(--muted-foreground)">--space-1</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:0.375rem;height:0.375rem;background:var(--primary);display:block"></b><span>0.375rem</span><code style="color:var(--muted-foreground)">--space-1.5</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:0.5rem;height:0.5rem;background:var(--primary);display:block"></b><span>0.5rem</span><code style="color:var(--muted-foreground)">--space-2</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:0.625rem;height:0.625rem;background:var(--primary);display:block"></b><span>0.625rem</span><code style="color:var(--muted-foreground)">--space-2.5</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:0.75rem;height:0.75rem;background:var(--primary);display:block"></b><span>0.75rem</span><code style="color:var(--muted-foreground)">--space-3</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:1rem;height:1rem;background:var(--primary);display:block"></b><span>1rem</span><code style="color:var(--muted-foreground)">--space-4</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:1.5rem;height:1.5rem;background:var(--primary);display:block"></b><span>1.5rem</span><code style="color:var(--muted-foreground)">--space-6</code></div><div style="display:grid;gap:4px;justify-items:center;font-size:11px"><b style="width:2rem;height:2rem;background:var(--primary);display:block"></b><span>2rem</span><code style="color:var(--muted-foreground)">--space-8</code></div></div></body></html>
