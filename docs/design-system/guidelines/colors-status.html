<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Up, down, attention, unknown; destructive" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px;display:grid;gap:4px;font-size:11px}.s b{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s code{font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="sw"><div class="s"><b style="background:var(--status-up)"></b><span>Up / ok</span><code>--status-up</code></div><div class="s"><b style="background:var(--status-down)"></b><span>Down</span><code>--status-down</code></div><div class="s"><b style="background:var(--status-attention)"></b><span>Attention (icons only)</span><code>--status-attention</code></div><div class="s"><b style="background:var(--status-unknown)"></b><span>Unknown</span><code>--status-unknown</code></div><div class="s"><b style="background:var(--destructive)"></b><span>Destructive</span><code>--destructive</code></div></div></body></html>
