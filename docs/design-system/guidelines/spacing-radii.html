<!-- @dsCard group="Spacing" viewport="700x110" name="Radii" subtitle="3–8px; nothing rounder except the pill token" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--card)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:120px;display:grid;gap:4px;font-size:11px}.s b{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s code{font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="sw"><div class="s"><b style="border-radius:var(--radius-sm);background:var(--secondary);border:1px solid var(--border-strong)"></b><span>3px badges, chips</span><code>--radius-sm</code></div><div class="s"><b style="border-radius:var(--radius-md);background:var(--secondary);border:1px solid var(--border-strong)"></b><span>4px buttons, inputs</span><code>--radius-md</code></div><div class="s"><b style="border-radius:var(--radius);background:var(--secondary);border:1px solid var(--border-strong)"></b><span>6px menus</span><code>--radius</code></div><div class="s"><b style="border-radius:var(--radius-lg);background:var(--secondary);border:1px solid var(--border-strong)"></b><span>8px cards, dialogs</span><code>--radius-lg</code></div></div></body></html>
