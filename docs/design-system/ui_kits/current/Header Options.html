<!doctype html><html><head><meta charset="utf-8">
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.__MAM_KIT=true</script>
<script src="../_shared/ds-fallback.js" data-root="../../"></script>
<script src="../_shared/data.js"></script>
<title>Header — варіанти</title>
<style>a{color:var(--primary)}a:hover{color:var(--primary-hover)}.frame{position:absolute;left:40px;width:1280px;display:grid;gap:10px}.tag{display:flex;align-items:center;gap:8px;font-size:13px}.tag b{background:var(--foreground);color:var(--background);padding:2px 8px;border-radius:4px;font-family:var(--font-mono);font-size:12px}.tag span{color:var(--muted-foreground)}.screen{position:relative;background:var(--background);border:1px solid var(--border);border-radius:10px;min-height:290px}.screen>header{border-radius:10px 10px 0 0}.why{font-size:12px;color:var(--muted-foreground);max-width:72rem;text-wrap:pretty}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel">
const d = () => window.MAM_DATA;
const NAV = [['search', 'Search', 'Search'], ['library', 'Library', 'LibraryBig']];
const SETTINGS = [['integrations', 'Integrations', 'Plug', 'Jellyfin, release sources, qBittorrent'], ['destinations', 'Destinations', 'FolderInput', 'Where downloads go'], ['folders', 'Media folders', 'FolderOpen', 'What the app may read'], ['users', 'Users', 'Users', 'Who can sign in']];
const TITLES = { search: 'Search', library: 'Library', integrations: 'Integrations', destinations: 'Destinations', folders: 'Media folders', users: 'Users', home: 'Media Acquisition Manager' };

function useOutside(open, setOpen) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return undefined;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('pointerdown', h);
    return () => document.removeEventListener('pointerdown', h);
  }, [open]);
  return ref;
}
function applyTheme(m) {
  const dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  try { if (m === 'system') localStorage.removeItem('mam:theme'); else localStorage.setItem('mam:theme', m); } catch (e) {}
}
function ThemeCycle() {
  const { Button } = window.MAM_DS;
  const [m, setM] = React.useState(() => { try { return localStorage.getItem('mam:theme') || 'system'; } catch (e) { return 'system'; } });
  const next = { light: 'dark', dark: 'system', system: 'light' };
  const icon = { light: 'Sun', dark: 'Moon', system: 'Monitor' };
  return <Button variant="ghost" size="icon" icon={icon[m]} title={'Theme: ' + m + ' — click for ' + next[m]} onClick={() => { const n = next[m]; setM(n); applyTheme(n); }} />;
}
function Brand({ size = 30, version = 'under', onClick }) {
  const { AppLogo } = window.MAM_DS;
  return (
    <a href="#" onClick={(e) => { e.preventDefault(); onClick && onClick(); }} title="The version you are running" style={{ display: 'inline-flex', alignItems: 'center', gap: '0.625rem', color: 'inherit', textDecoration: 'none', flexShrink: 0 }}>
      <AppLogo size={size} />
      {version === 'under' ? (
        <span style={{ display: 'grid', gap: 1, lineHeight: 1.15 }}>
          <span style={{ fontSize: '0.9375rem', fontWeight: 600, color: 'var(--foreground)' }}>Media Acquisition Manager</span>
          <span className="mono" style={{ fontSize: '0.6875rem', color: 'var(--subtle-foreground)' }}>v{d().version}</span>
        </span>
      ) : (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: '0.9375rem', fontWeight: 600, color: 'var(--foreground)' }}>Media Acquisition Manager</span>
          <span className="mono" style={{ fontSize: '0.6875rem', color: 'var(--muted-foreground)', border: '1px solid var(--border)', borderRadius: 'var(--radius-pill)', padding: '1px 7px' }}>v{d().version}</span>
        </span>
      )}
    </a>
  );
}
function Avatar({ size = 28 }) {
  return <span style={{ width: size, height: size, borderRadius: 9999, display: 'inline-grid', placeItems: 'center', background: 'var(--tint-selected)', color: 'var(--primary)', fontWeight: 600, fontSize: 12, flexShrink: 0 }}>{d().user.userName[0].toUpperCase()}</span>;
}
function Ready() {
  return <span title="The server is ready" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'var(--muted-foreground)' }}><span style={{ width: 7, height: 7, borderRadius: 9999, background: 'var(--status-up)' }} />Ready</span>;
}
function Stub({ page }) {
  return (
    <div style={{ padding: '1.5rem', maxWidth: '64rem', margin: '0 auto', display: 'grid', gap: '0.5rem' }}>
      <h1 style={{ fontSize: 'var(--text-2xl)', fontWeight: 600 }}>{TITLES[page]}</h1>
      <div style={{ display: 'flex', gap: 12 }}>{[340, 96, 150, 150].map((w, i) => <span key={i} style={{ width: w, height: 36, borderRadius: 4, border: '1px solid var(--input)', background: 'var(--card)' }} />)}</div>
    </div>
  );
}
const hdr = { position: 'sticky', top: 0, zIndex: 30, background: 'var(--card)', borderBottom: '1px solid var(--border)' };
const menuPos = { position: 'absolute', top: 'calc(100% + 0.375rem)', right: 0, zIndex: 50 };

/* 2b — segmented nav in the centre, quiet icon controls right */
function HeaderB({ page, go }) {
  const { Icon, Menu } = window.MAM_DS;
  const [open, setOpen] = React.useState(false); const ref = useOutside(open, setOpen);
  return (
    <header style={{ ...hdr, display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'center', gap: '1rem', padding: '0.625rem 1.5rem' }}>
      <Brand version="pill" size={26} onClick={() => go('home')} />
      <nav style={{ display: 'inline-flex', padding: 3, gap: 2, background: 'var(--secondary)', border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)' }}>
        {NAV.map(([p, label, icon]) => { const on = page === p; return (
          <a key={p} href="#" onClick={(e) => { e.preventDefault(); go(p); }} aria-current={on ? 'page' : undefined}
            style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '0.375rem 1rem', borderRadius: 'var(--radius)', fontSize: '0.875rem', fontWeight: 500, textDecoration: 'none',
              background: on ? 'var(--card)' : 'transparent', color: on ? 'var(--foreground)' : 'var(--muted-foreground)', boxShadow: on ? 'var(--shadow-sm)' : 'none' }}>
            <Icon name={icon} size={16} style={{ color: on ? 'var(--primary)' : undefined }} />{label}</a>); })}
      </nav>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: '0.75rem' }}>
        <Ready /><ThemeCycle />
        <div ref={ref} style={{ position: 'relative' }}>
          <button type="button" onClick={() => setOpen(!open)} title={'Signed in as ' + d().user.userName} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, cursor: 'pointer', borderRadius: 9999, padding: 2 }}><Avatar /><Icon name="ChevronDown" size={14} style={{ color: 'var(--muted-foreground)' }} /></button>
          {open ? <div style={menuPos}><Menu items={[...SETTINGS.map(([p, l, i]) => ({ label: l, icon: i, onClick: () => { setOpen(false); go(p); } })), { separator: true }, { label: 'Sign out', icon: 'LogOut', onClick: () => setOpen(false) }]} /></div> : null}
        </div>
      </div>
    </header>
  );
}

/* 2c — two rows: identity bar, then underline tabs incl. owner settings */
function HeaderC({ page, go }) {
  const { Icon, Button, Menu, ThemeSwitch } = window.MAM_DS;
  const [open, setOpen] = React.useState(false); const ref = useOutside(open, setOpen);
  const Tab = ({ p, label, icon, quiet }) => { const on = page === p; return (
    <a href="#" onClick={(e) => { e.preventDefault(); go(p); }} aria-current={on ? 'page' : undefined}
      style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: 40, padding: '0 0.125rem', marginBottom: -1, fontSize: quiet ? '0.8125rem' : '0.875rem', fontWeight: 500, textDecoration: 'none',
        color: on ? 'var(--foreground)' : 'var(--muted-foreground)', borderBottom: '2px solid ' + (on ? 'var(--primary)' : 'transparent') }}>
      <Icon name={icon} size={quiet ? 14 : 16} />{label}</a>); };
  return (
    <header style={{ ...hdr }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', padding: '0.625rem 1.5rem 0.5rem' }}>
        <Brand onClick={() => go('home')} />
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
          <Ready /><ThemeSwitch />
          <div ref={ref} style={{ position: 'relative' }}>
            <Button variant="ghost" size="sm" icon="CircleUser" iconRight="ChevronDown" onClick={() => setOpen(!open)}>{d().user.userName}</Button>
            {open ? <div style={menuPos}><Menu items={[{ label: 'Sign out', icon: 'LogOut', onClick: () => setOpen(false) }]} /></div> : null}
          </div>
        </div>
      </div>
      <nav style={{ display: 'flex', alignItems: 'center', gap: '1.5rem', padding: '0 1.5rem' }}>
        {NAV.map(([p, l, i]) => <Tab key={p} p={p} label={l} icon={i} />)}
        <span style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--subtle-foreground)' }}>Settings</span>
        {SETTINGS.map(([p, l, i]) => <Tab key={p} p={p} label={l} icon={i} quiet />)}
      </nav>
    </header>
  );
}

/* 2d — the search field lives in the header */
function HeaderD({ page, go, onQuery }) {
  const { Icon, Menu, ThemeSwitch } = window.MAM_DS;
  const [open, setOpen] = React.useState(false); const ref = useOutside(open, setOpen);
  const [q, setQ] = React.useState('');
  const inp = React.useRef(null);
  React.useEffect(() => {
    const k = (e) => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); inp.current && inp.current.focus(); } };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, []);
  const on = page === 'library';
  return (
    <header style={{ ...hdr, display: 'flex', alignItems: 'center', gap: '1.25rem', padding: '0.625rem 1.5rem' }}>
      <Brand onClick={() => go('home')} />
      <form onSubmit={(e) => { e.preventDefault(); onQuery(q); go('search'); }} style={{ flex: '1 1 auto', maxWidth: '34rem', position: 'relative' }}>
        <Icon name="Search" size={16} style={{ position: 'absolute', left: 11, top: 10, color: 'var(--muted-foreground)' }} />
        <input ref={inp} className="ui-input" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search a movie — title, year or IMDb id" style={{ paddingLeft: 36, paddingRight: 40, background: 'var(--muted)', borderColor: 'transparent' }} />
        <kbd className="mono" style={{ position: 'absolute', right: 8, top: 8, fontSize: 11, padding: '1px 6px', border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-sm)', color: 'var(--muted-foreground)', background: 'var(--card)' }}>/</kbd>
      </form>
      <a href="#" onClick={(e) => { e.preventDefault(); go('library'); }} aria-current={on ? 'page' : undefined} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '0.375rem 0.625rem', borderRadius: 'var(--radius-md)', fontSize: '0.875rem', fontWeight: 500, textDecoration: 'none', color: on ? 'var(--foreground)' : 'var(--muted-foreground)', background: on ? 'var(--tint-selected)' : 'transparent' }}><Icon name="LibraryBig" size={16} />Library</a>
      <div ref={ref} style={{ position: 'relative', marginLeft: 'auto' }}>
        <button type="button" onClick={() => setOpen(!open)} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer', padding: '2px 6px 2px 2px', borderRadius: 9999 }}><Avatar /><span style={{ fontWeight: 500 }}>{d().user.userName}</span><Icon name="ChevronDown" size={14} style={{ color: 'var(--muted-foreground)' }} /></button>
        {open ? <div style={{ ...menuPos, width: 230 }} className="ui-menu">
          <div style={{ padding: '6px 12px 8px', display: 'grid', gap: 2 }}><strong>{d().user.userName}</strong><span style={{ fontSize: 12, color: 'var(--muted-foreground)' }}>Owner · v{d().version} · <span style={{ color: 'var(--status-up)' }}>Ready</span></span></div>
          <div className="ui-menu-sep" />
          {SETTINGS.map(([p, l, i]) => <button key={p} type="button" className="ui-menu-item" onClick={() => { setOpen(false); go(p); }}><window.MAM_DS.Icon name={i} size={14} />{l}</button>)}
          <div className="ui-menu-sep" />
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '4px 8px 4px 12px' }}><span>Theme</span><ThemeSwitch /></div>
          <div className="ui-menu-sep" />
          <button type="button" className="ui-menu-item" onClick={() => setOpen(false)}><window.MAM_DS.Icon name="LogOut" size={14} />Sign out</button>
        </div> : null}
      </div>
    </header>
  );
}

/* 2e — Settings becomes a header dropdown; the user button is only the account */
function HeaderE({ page, go }) {
  const { Icon, Menu, ThemeSwitch } = window.MAM_DS;
  const [open, setOpen] = React.useState(null);
  const ref = useOutside(!!open, () => setOpen(null));
  const isSettings = SETTINGS.some(([p]) => p === page);
  const link = (on) => ({ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '0.375rem 0.625rem', borderRadius: 'var(--radius-md)', fontSize: '0.875rem', fontWeight: 500, textDecoration: 'none', cursor: 'pointer', color: on ? 'var(--foreground)' : 'var(--muted-foreground)', background: on ? 'var(--tint-selected)' : 'transparent' });
  return (
    <header ref={ref} style={{ ...hdr, display: 'flex', alignItems: 'center', gap: '1.5rem', padding: '0.625rem 1.5rem' }}>
      <Brand onClick={() => go('home')} />
      <nav style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
        {NAV.map(([p, l, i]) => <a key={p} href="#" onClick={(e) => { e.preventDefault(); go(p); }} style={link(page === p)}><Icon name={i} size={16} />{l}</a>)}
        <div style={{ position: 'relative' }}>
          <button type="button" onClick={() => setOpen(open === 'settings' ? null : 'settings')} style={link(isSettings)}><Icon name="Settings" size={16} />Settings<Icon name="ChevronDown" size={14} /></button>
          {open === 'settings' ? <div style={{ position: 'absolute', top: 'calc(100% + 0.375rem)', left: 0, zIndex: 50, width: 300 }} className="ui-menu">
            {SETTINGS.map(([p, l, i, hint]) => <button key={p} type="button" className="ui-menu-item" style={{ alignItems: 'flex-start', whiteSpace: 'normal' }} onClick={() => { setOpen(null); go(p); }}>
              <Icon name={i} size={16} style={{ marginTop: 2, color: page === p ? 'var(--primary)' : 'var(--muted-foreground)' }} />
              <span style={{ display: 'grid', gap: 1 }}><span style={{ fontWeight: 500 }}>{l}</span><span style={{ fontSize: 12, color: 'var(--muted-foreground)' }}>{hint}</span></span></button>)}
          </div> : null}
        </div>
      </nav>
      <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
        <ThemeSwitch />
        <div style={{ position: 'relative' }}>
          <button type="button" onClick={() => setOpen(open === 'user' ? null : 'user')} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer', padding: '2px 6px 2px 2px', borderRadius: 'var(--radius-md)' }}>
            <Avatar size={30} /><span style={{ display: 'grid', textAlign: 'left', lineHeight: 1.15 }}><span style={{ fontWeight: 500 }}>{d().user.userName}</span><span style={{ fontSize: 11, color: 'var(--muted-foreground)' }}>Owner</span></span><Icon name="ChevronDown" size={14} style={{ color: 'var(--muted-foreground)' }} /></button>
          {open === 'user' ? <div style={menuPos}><Menu items={[{ label: 'Sign out', icon: 'LogOut', onClick: () => setOpen(null) }]} /></div> : null}
        </div>
      </div>
    </header>
  );
}

function Frame({ id, name, why, top, render }) {
  const [page, setPage] = React.useState('search');
  const [q, setQ] = React.useState('');
  return (
    <div id={id} className="frame" style={{ top }}>
      <div className="tag"><b>{id}</b><strong>{name}</strong></div>
      <div className="screen">{render({ page, go: setPage, onQuery: setQ })}<Stub page={page} />{q ? <p style={{ padding: '0 1.5rem', maxWidth: '64rem', margin: '0 auto', color: 'var(--muted-foreground)' }}>Searching for “{q}”…</p> : null}</div>
      <p className="why">{why}</p>
    </div>
  );
}
const V = [
  ['2a', 'Зараз', (p) => <AppHeader page={p.page} onNav={p.go} onSignOut={() => {}} />, 'Поточний хедер: бренд з версією, посилання-пігулки, перемикач теми з трьома іконками й меню користувача, у якому сховано налаштування.'],
  ['2b', 'Сегменти по центру', (p) => <HeaderB {...p} />, 'Навігація у вигляді сегментованого перемикача по центру, версія — маленька пігулка біля назви. Праворуч тихі іконки: статус Ready, одна кнопка теми (по кліку Light → Dark → System) і аватар з налаштуваннями.'],
  ['2c', 'Два ряди з вкладками', (p) => <HeaderC {...p} />, 'Зверху бренд, статус, тема й акаунт; знизу вкладки з підкресленням. Сторінки власника стоять праворуч на видноті, а не в меню. Займає приблизно 96px висоти замість 56.'],
  ['2d', 'Пошук у хедері', (p) => <HeaderD {...p} />, 'Пошук — головна дія, тому поле пошуку стоїть прямо в хедері на кожній сторінці (клавіша / ставить курсор у поле). Enter відкриває Search. Тема, статус, версія й налаштування зібрані в меню акаунта.'],
  ['2e', 'Settings у хедері', (p) => <HeaderE {...p} />, 'Поруч із Search і Library є випадаючий список Settings: чотири сторінки власника з підписами. Меню акаунта лише для виходу, під іменем роль Owner. Тема лишилась перемикачем.'],
];
function App() {
  return <>{V.map(([id, name, render, why], i) => <Frame key={id} id={id} name={name} why={why} top={40 + i * 420} render={render} />)}</>;
}
let __started = false;
function start(){ if (__started) return; __started = true; window.MAM_DS = window['MediaAcquisitionManagerDS_29af91']; ReactDOM.createRoot(document.getElementById('root')).render(<App />); }
if (window.__dsReady) start(); else window.addEventListener('ds-ready', start);
</script></body></html>
