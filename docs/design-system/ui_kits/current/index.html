<script type="text/babel">
function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('mamkit:current:page') || 'search');

  const S = screens[page] || SearchScreen;
  const sim = useSim();
  return (
    <div style={{ minHeight: '100dvh', display: 'flex', flexDirection: 'column' }}>
      <AppHeader page={page} onNav={nav} onSignOut={() => setSignedIn(false)} query={query} onQuery={setQuery} />

      <main style={{ flex: 1, width: '100%', maxWidth: '64rem', margin: '0 auto', padding: '1.5rem' }}>
        {!signedIn ? <SignInScreen onSignIn={() => setSignedIn(true)} /> : sim.notFound ? <NotFound onHome={() => nav('home')} /> : sim.crash ? <CrashFallback /> : <S query={query} onSignOut={() => setSignedIn(false)} />}

  );
}
