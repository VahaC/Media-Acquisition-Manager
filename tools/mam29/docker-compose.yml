# MAM-29 and MAM-31 (Phase D): Transmission 4.1.3, a temporary Transmission 4.0.6 and Jackett on media-stack, as one
# Stashboard project. Not part of MAM; tools/mam29/README.md says what each part is for.
#
# Before the first "Save & apply", change the four CHANGE-ME values (user names and passwords of the two Transmissions).
# Everything lives under /srv/docker/mam-phase-d on media-stack; nothing here writes into the media folder.

x-owner: &owner
  PUID: "1000"   # the media's owner, like qBittorrent and MAM
  PGID: "100"
  TZ: Europe/Kyiv

services:
  # Runs once before both Transmissions and exits. Docker creates a missing bind-mount folder owned by root, and
  # Transmission (uid 1000) couldn't write to /scratch. A first settings.json is written from the image's own defaults
  # with two changes, so nothing has to be set in the web UI: torrents added without a folder go to /scratch, not
  # into /downloads/complete, and the temporary folder for unfinished torrents is off (Transmission doesn't report it
  # per torrent). An existing settings.json is never touched.
  transmission-prepare:
    image: lscr.io/linuxserver/transmission:4.1.3-r0-ls363
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for dir in /t413/config /t413/scratch /t406/config /t406/scratch; do mkdir -p "$$dir"; done
        for config in /t413/config /t406/config; do
          if [ ! -f "$$config/settings.json" ]; then
            jq '."download-dir" = "/scratch" | ."incomplete-dir" = "/scratch/incomplete" | ."incomplete-dir-enabled" = false' \
              /defaults/settings.json > "$$config/settings.json"
          fi
        done
        chown -R 1000:100 /t413 /t406
    volumes:
      - /srv/docker/mam-phase-d/transmission:/t413
      - /srv/docker/mam-phase-d/transmission-406:/t406
    restart: "no"

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3-r0-ls363
    container_name: transmission
    depends_on:
      transmission-prepare:
        condition: service_completed_successfully
    environment:
      <<: *owner
      USER: "CHANGE-ME-user"        # Transmission asks for a password only when USER and PASS are both set
      PASS: "CHANGE-ME-password"    # not a plain word such as "transmission" (the scripts redact it everywhere); a $ is written $$
      PEERPORT: "51413"             # qBittorrent listens on 6881
    volumes:
      - /srv/docker/mam-phase-d/transmission/config:/config
      - /srv/docker/mam-phase-d/transmission/scratch:/scratch
      # MAM-31 only: the media folder, the same host folder qBittorrent mounts as /downloads (ADR 0003). Left out for
      # MAM-29, which never writes there. Before uncommenting, check that qBittorrent's compose has the same host path.
      # - /mnt/media14tb/jelly_qbit_data/Torrent:/downloads
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped

  # Temporary: MAM-29's short set on the oldest Transmission line MAM supports. Remove this block (and its container)
  # once `transmission_samples.py --short` has run.
  transmission-406:
    image: lscr.io/linuxserver/transmission:4.0.6-r6-ls326
    container_name: transmission-406
    depends_on:
      transmission-prepare:
        condition: service_completed_successfully
    environment:
      <<: *owner
      USER: "CHANGE-ME-user"
      PASS: "CHANGE-ME-password"
      PEERPORT: "51414"
    volumes:
      - /srv/docker/mam-phase-d/transmission-406/config:/config
      - /srv/docker/mam-phase-d/transmission-406/scratch:/scratch
    ports:
      - "9092:9091"
      - "51414:51414"
      - "51414:51414/udp"
    restart: "no"

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.2830-ls3
    container_name: jackett
    environment:
      <<: *owner
      # No AUTO_UPDATE: the version stays the one the samples name.
    volumes:
      - /srv/docker/mam-phase-d/jackett:/config
    ports:
      - "9117:9117"
    restart: unless-stopped
